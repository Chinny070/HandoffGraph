name: HandoffGraph GenVM lint and Direct Mode
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  genvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned GenLayer test tooling
        run: python -m pip install --pre -r requirements-dev.txt
      - name: Lint, structure, offline mock and real Direct Mode tiers
        run: python scripts/verify.py
