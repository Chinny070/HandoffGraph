name: HandoffGraph offline safety suite
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test runner
        run: python -m pip install 'pytest>=8.2,<9'
      - name: Structure and boundary checks
        run: python scripts/preflight.py
      - name: Compile source and scripts
        run: python -m compileall -q contracts tests scripts
      - name: Offline mock state-machine tests
        run: python -m pytest tests/ -q
